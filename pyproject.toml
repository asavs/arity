[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arity"
dynamic = ["version"]
description = "A small, provider-agnostic trial kernel for agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Asa Schaeffer" }
]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "arity._version.__version__" }

[project.scripts]
arity = "arity.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arity*"]

[tool.setuptools.package-data]
arity = [
    "definitions/**/*.md",
    "definitions/**/*.py",
]
