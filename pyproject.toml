[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gorkbot"
version = "0.2.0"
description = "A composable statechart chassis for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Asa Schaeffer" }
]
dependencies = []

[project.scripts]
gorkbot = "gorkbot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gorkbot*"]
