<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" role="img"><title>Papercuts: the improvement loop</title><style>text{font-family:system-ui,-apple-system,sans-serif;dominant-baseline:central}.bg{fill:#FFFFFF}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.box,.store{fill:#F1EFE8;stroke:#888780;stroke-width:.5}.frame{fill:none;stroke:#B4B2A9;stroke-width:.5}.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5}.rep{fill:none;stroke:#BA7517;stroke-width:1.5}.mk{fill:none;stroke:#5F5E5A;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.mkr{fill:none;stroke:#BA7517;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}@media (prefers-color-scheme:dark){.bg{fill:#1F1E1D}.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.box,.store{fill:#2C2C2A;stroke:#888780}.frame{stroke:#5F5E5A}.arr,.mk{stroke:#B4B2A9}.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-coral rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mkr" d="M2 1L8 5L2 9"/></marker></defs><rect class="bg" width="680" height="290" rx="12"/>
<g><rect class="box" x="40" y="40" width="160" height="56" rx="8"/><text class="th" x="120.0" y="59.0" text-anchor="middle">Papercut</text><text class="ts" x="120.0" y="78.0" text-anchor="middle">From a user or agent</text></g>
<path class="arr" d="M204 68 L256 68" marker-end="url(#a)"/>
<g><path class="store" d="M260 50 A70.0 10 0 0 1 400 50 L400 90 A70.0 10 0 0 1 260 90 Z"/><path class="store" style="fill:none" d="M260 50 A70.0 10 0 0 0 400 50"/><text class="th" x="330.0" y="76.0" text-anchor="middle">Papercut log</text></g>
<path class="arr" d="M404 68 L456 68" marker-end="url(#a)"/>
<g class="c-amber"><rect x="460" y="40" width="180" height="56" rx="8"/><text class="th" x="550.0" y="59.0" text-anchor="middle">Pick up</text><text class="ts" x="550.0" y="78.0" text-anchor="middle">From the task board</text></g>
<path class="arr" d="M550 96 L550 186" marker-end="url(#a)"/>
<g class="c-amber"><rect x="460" y="190" width="180" height="56" rx="8"/><text class="th" x="550.0" y="209.0" text-anchor="middle">Propose a fix</text><text class="ts" x="550.0" y="228.0" text-anchor="middle">Skill, tool or prompt</text></g>
<path class="arr" d="M456 218 L404 218" marker-end="url(#a)"/>
<g><path class="store" d="M260 200 A70.0 10 0 0 1 400 200 L400 240 A70.0 10 0 0 1 260 240 Z"/><path class="store" style="fill:none" d="M260 200 A70.0 10 0 0 0 400 200"/><text class="th" x="330.0" y="217.0" text-anchor="middle">Registry</text><text class="ts" x="330.0" y="236.0" text-anchor="middle">As a new variant</text></g>
<path class="arr" d="M256 218 L204 218" marker-end="url(#a)"/>
<g class="c-teal"><rect x="40" y="190" width="160" height="56" rx="8"/><text class="th" x="120.0" y="209.0" text-anchor="middle">Blind test</text><text class="ts" x="120.0" y="228.0" text-anchor="middle">Old against new</text></g>
<text class="ts" x="120" y="266" text-anchor="middle">Winner becomes the default</text>
