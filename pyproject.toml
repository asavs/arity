[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arity"
dynamic = ["version"]
description = "A small, provider-agnostic trial kernel for agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Asa Schaeffer" }
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "gorkbot._version.__version__" }

[project.scripts]
arity = "gorkbot.cli:main"
gorkbot = "gorkbot.cli:main"

[project.urls]
Homepage = "https://github.com/asavs/arity"
Repository = "https://github.com/asavs/arity"
Issues = "https://github.com/asavs/arity/issues"
Changelog = "https://github.com/asavs/arity/blob/main/RELEASE.md"
Security = "https://github.com/asavs/arity/security/policy"

[tool.setuptools.packages.find]
where = ["."]
include = ["gorkbot*"]

[tool.setuptools.package-data]
gorkbot = [
    "definitions/**/*.md",
    "definitions/**/*.py",
]
