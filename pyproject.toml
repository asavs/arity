[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arity"
dynamic = ["version"]
description = "A composable statechart chassis for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Asa Schaeffer" }
]
dependencies = []

[project.scripts]
arity = "gorkbot.cli:main"
gorkbot = "gorkbot.cli:main"
[tool.setuptools.dynamic]
version = {attr = "gorkbot.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["gorkbot*"]
