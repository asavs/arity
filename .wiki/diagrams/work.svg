<text class="ts" x="555" y="146" text-anchor="end">wakes a good fit</text>
<g class="c-purple"><rect x="490" y="190" width="150" height="56" rx="8"/><text class="th" x="565.0" y="209.0" text-anchor="middle">Agent</text><text class="ts" x="565.0" y="228.0" text-anchor="middle">Does the work</text></g>
