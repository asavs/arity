<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 388" width="680" role="img"><title>One thread's turn and the three timings</title><style>text{font-family:system-ui,-apple-system,sans-serif;dominant-baseline:central}.bg{fill:#FFFFFF}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.box,.store{fill:#F1EFE8;stroke:#888780;stroke-width:.5}.frame{fill:none;stroke:#B4B2A9;stroke-width:.5}.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5}.rep{fill:none;stroke:#BA7517;stroke-width:1.5}.mk{fill:none;stroke:#5F5E5A;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.mkr{fill:none;stroke:#BA7517;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}.c-amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.5}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}@media (prefers-color-scheme:dark){.bg{fill:#1F1E1D}.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.box,.store{fill:#2C2C2A;stroke:#888780}.frame{stroke:#5F5E5A}.arr,.mk{stroke:#B4B2A9}.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}.c-coral rect{fill:#712B13;stroke:#F0997B}.c-coral .th{fill:#F5C4B3}.c-coral .ts{fill:#F0997B}.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mkr" d="M2 1L8 5L2 9"/></marker></defs><rect class="bg" width="680" height="388" rx="12"/>
<text class="th" x="40" y="36" text-anchor="start">Message timing</text>
<g class="c-coral"><rect x="40" y="64" width="150" height="48" rx="8"/><text class="th" x="115.0" y="79.0" text-anchor="middle">Steer</text><text class="ts" x="115.0" y="98.0" text-anchor="middle">Cut reply, or after tools</text></g>
<g class="c-coral"><rect x="40" y="220" width="150" height="48" rx="8"/><text class="th" x="115.0" y="235.0" text-anchor="middle">After turn</text><text class="ts" x="115.0" y="254.0" text-anchor="middle">When turn would end</text></g>
<g class="c-coral"><rect x="40" y="314" width="150" height="48" rx="8"/><text class="th" x="115.0" y="329.0" text-anchor="middle">Inbox</text><text class="ts" x="115.0" y="348.0" text-anchor="middle">Context only, no wake</text></g>
<rect class="frame" x="236" y="24" width="404" height="262" rx="12" stroke-dasharray="4 4"/>
<text class="th" x="252" y="44" text-anchor="start">One thread's turn</text>
<text class="ts" x="624" y="44" text-anchor="end">One lease holder</text>
<g class="c-purple"><rect x="280" y="64" width="190" height="48" rx="8"/><text class="th" x="375.0" y="79.0" text-anchor="middle">Stream reply</text><text class="ts" x="375.0" y="98.0" text-anchor="middle">Model call</text></g>
<path class="arr" d="M375 112 L375 132" marker-end="url(#a)"/>
<g><path class="box" d="M307 158 L375 136 L443 158 L375 180 Z"/><text class="th" x="375" y="158" text-anchor="middle">Tool calls?</text></g>
<text class="ts" x="460" y="145" text-anchor="middle">yes</text>
<path class="arr" d="M443 158 L476 158" marker-end="url(#a)"/>
<g class="c-purple"><rect x="480" y="134" width="144" height="48" rx="8"/><text class="th" x="552.0" y="149.0" text-anchor="middle">Run tools</text><text class="ts" x="552.0" y="168.0" text-anchor="middle">Atomic batch</text></g>
<path class="arr" d="M552 134 L552 88 L474 88" marker-end="url(#a)"/>
<text class="ts" x="385" y="198" text-anchor="start">no</text>
<path class="arr" d="M375 180 L375 216" marker-end="url(#a)"/>
<g><rect class="box" x="280" y="220" width="190" height="48" rx="8"/><text class="th" x="375.0" y="235.0" text-anchor="middle">End of turn</text><text class="ts" x="375.0" y="254.0" text-anchor="middle">Extend or release lease</text></g>
<path class="arr" d="M375 290 L375 304" marker-end="url(#a)" marker-start="url(#a)"/>
<text class="ts" x="387" y="297" text-anchor="start">every step</text>
<g><path class="store" d="M295 318 A80.0 10 0 0 1 455 318 L455 364 A80.0 10 0 0 1 295 364 Z"/><path class="store" style="fill:none" d="M295 318 A80.0 10 0 0 0 455 318"/><text class="th" x="375.0" y="338.0" text-anchor="middle">Journal</text><text class="ts" x="375.0" y="357.0" text-anchor="middle">Append-only tree</text></g>
<path class="arr" d="M190 88 L276 88" marker-end="url(#a)"/>
<path class="arr" d="M190 244 L276 244" marker-end="url(#a)"/>
<path class="arr" d="M190 338 L291 338" marker-end="url(#a)"/>
</svg>
