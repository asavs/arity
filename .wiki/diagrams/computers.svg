<g><rect class="box" x="156" y="198" width="180" height="56" rx="8"/><text class="th" x="246.0" y="217.0" text-anchor="middle">Cloud machines</text><text class="ts" x="246.0" y="236.0" text-anchor="middle">On demand, paid by hour</text></g>
